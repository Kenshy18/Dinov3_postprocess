__include__: [
  '../dataset/crowdhuman_person_fbox_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
  '../base/rtv4.yml'
]

output_dir: ./outputs/rtv4_hgnetv2_x_crowdhuman_person

use_wandb: True
wandb_project: rtdetrv4-crowdhuman
wandb_mode: online
wandb_log_val_images: True
wandb_num_val_images: 4
wandb_val_score_thr: 0.35

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

RTv4:
  backbone: HGNetv2

HGNetv2:
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

HybridEncoder:
  hidden_dim: 384
  dim_feedforward: 2048
  distill_teacher_dim: 768

DFINETransformer:
  feat_channels: [384, 384, 384]
  reg_scale: 8

RTv4Criterion:
  weight_dict:
    loss_distill: 20
  distill_adaptive_params:
    enabled: True
    rho: 2
    delta: 0.25
    default_weight: 20

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000005
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 58

flat_epoch: 29
no_aug_epoch: 8

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 29, 50]
  collate_fn:
    mixup_epochs: [4, 29]
    stop_epoch: 50
